plugins {
    id 'com.android.application'
}

android {
    namespace 'id.pandu.monitoringclient'
    compileSdk 34

    defaultConfig {
        applicationId 'id.pandu.monitoringclient'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Kunci tetap di repo supaya setiap build punya tanda tangan sama (APK baru bisa menimpa yang lama).
    signingConfigs {
        release {
            storeFile file('signing.keystore')
            storePassword 'monitoring'
            keyAlias 'monitoring'
            keyPassword 'monitoring'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
